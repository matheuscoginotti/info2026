<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilha de Aulas - Redes e IoT</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Paleta Dark Tech (Padrão 3info) */
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-gold: #d4af37;
            --accent-blue: #38bdf8;
            --border-tech: rgba(148, 163, 184, 0.3);
            
            /* Específicos do Mapa */
            --grid-color: rgba(56, 189, 248, 0.05);
            --node-bg: rgba(15, 23, 42, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 80px;
        }

        /* --- Fundo Cibernético --- */
        body::before {
            content: '';
            position: fixed;
            width: 200vw;
            height: 200vh;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(1000px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            opacity: 0.8;
            pointer-events: none;
            z-index: -1;
            animation: grid-pulse 10s infinite alternate;
        }

        @keyframes grid-pulse {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* --- Barra Superior Fixa --- */
        .top-bar {
            width: 100%;
            padding: 1.5rem 20px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            align-items: center;
        }

        .btn-back {
            color: var(--accent-blue);
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .btn-back:hover {
            color: var(--text-primary);
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin: 6rem 0 4rem;
            z-index: 2;
            position: relative;
            padding: 0 20px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
            position: relative;
            max-width: 900px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            opacity: 0.8;
        }

        .subtitle {
            color: var(--accent-gold);
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 1.1rem;
            margin-top: 20px;
            font-weight: 600;
        }

        /* --- Mapa (Grid) --- */
        .lesson-map {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4rem 2rem;
            max-width: 1000px;
            width: 95%;
            z-index: 2;
            padding: 20px;
        }

        /* --- Item da Aula --- */
        .lesson-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Botão Octogonal */
        .lesson-btn {
            width: 85px;
            height: 85px;
            background: var(--node-bg);
            border: 1px solid var(--border-tech);
            clip-path: polygon(15% 0, 85% 0, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0 85%, 0 15%);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: blur(8px);
        }

        /* Ícone Centralizado */
        .lesson-icon {
            font-size: 2.2rem;
            z-index: 2;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        /* Ícone de Status (Cadeado/Check) */
        .status-badge {
            position: absolute;
            bottom: -8px;
            background: var(--bg-color);
            border: 1px solid var(--border-tech);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            z-index: 3;
            transition: all 0.3s ease;
        }

        /* --- Título da Aula (Abaixo do Botão) --- */
        .lesson-title-label {
            margin-top: 15px;
            font-size: 0.95rem;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            max-width: 150px;
            line-height: 1.2;
            transition: color 0.3s ease;
        }

        /* --- Texto Informativo (Tempo) --- */
        .access-info {
            margin-top: 5px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'Chakra Petch', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            min-height: 1rem;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        /* --- Estados (Hover e Acessado) --- */
        .lesson-btn:hover {
            transform: translateY(-5px);
            background: var(--card-bg);
            border-color: var(--accent-blue);
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .lesson-btn:hover .lesson-icon {
            color: var(--accent-blue);
        }

        .lesson-item.accessed .lesson-btn {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.1);
        }
        
        .lesson-item.accessed .lesson-icon {
            color: var(--accent-gold);
        }

        .lesson-item.accessed .status-badge {
            color: var(--bg-color);
            background: var(--accent-gold);
            border-color: var(--accent-gold);
        }

        .lesson-item.accessed .lesson-title-label {
            color: var(--accent-gold);
        }

        .lesson-item.accessed .access-info {
            opacity: 1;
            transform: translateY(0);
            color: var(--text-secondary);
        }

        /* --- Conectores entre os Nós --- */
        .lesson-item:not(:nth-child(4n))::after {
            content: '';
            position: absolute;
            right: -2rem;
            top: 42px; /* Meio do botão */
            width: 2rem;
            height: 2px;
            background: linear-gradient(90deg, var(--border-tech) 0%, var(--border-tech) 50%, transparent 100%);
            z-index: -1;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .lesson-item.accessed:not(:nth-child(4n))::after {
            background: var(--accent-gold);
            opacity: 0.6;
        }

        /* Responsividade Mobile */
        @media (max-width: 800px) {
            h1 { font-size: 2.2rem; }
            .lesson-map {
                grid-template-columns: repeat(2, 1fr);
                gap: 3rem 2rem;
            }
            .lesson-item:not(:nth-child(4n))::after { display: none; }
            .lesson-item:not(:nth-child(2n))::after {
                content: '';
                position: absolute;
                right: -2rem;
                top: 42px;
                width: 2rem;
                height: 2px;
                background: var(--border-tech);
                display: block;
            }
            .lesson-item.accessed:not(:nth-child(2n))::after {
                 background: var(--accent-gold);
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="3infomenu.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar</a>
    </div>

    <header>
        <h1>Redes, Segurança da Informação e Internet das Coisas</h1>
        <div class="subtitle">Trilha de Aprendizagem</div>
    </header>

    <div class="lesson-map" id="lessonMap"></div>

    <script>
        const STORAGE_KEY_PREFIX = '3info_redes_lesson_';
        const mapContainer = document.getElementById('lessonMap');

        // Estrutura das Aulas (ID, Título e Ícone do FontAwesome)
        const lessonsData = [
            { id: 1, title: "Introdução às Redes", icon: "fa-network-wired" },
            { id: 2, title: "Nomenclaturas e Abrengências + Tipos de Cabos", icon: "fa-ethernet" },
            { id: 3, title: "Modelo OSI, Endereçamentos, Portas e Protocolos", icon: "fa-layer-group" },
            { id: 4, title: "Equipamentos e Infraestrutura", icon: "fa-server" },
            { id: 5, title: "Métodos de Transmissão", icon: "fa-share-nodes" },
            { id: 6, title: "Redes Sem Fio", icon: "fa-wifi" },
            { id: 7, title: "Internet das Coisas (IoT)", icon: "fa-house-signal" },
            { id: 8, title: "Boas Práticas e Segurança", icon: "fa-user-secret" },
            { id: 9, title: "Simulando Redes com Cisco Packet Tracer", icon: "fa-project-diagram" },
            { id: 10, title: "Segurança da Informação e a Tríade CID", icon: "fa-shield-halved" },
            { id: 11, title: "Criptografia Clássica e Moderna", icon: "fa-shield" }
        ];

        function getTimeAgo(timestamp) {
            if (!timestamp) return '';
            const now = Date.now();
            const diffMs = now - parseInt(timestamp);
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMinutes = Math.floor(diffMs / (1000 * 60));

            if (diffMinutes < 1) return 'ONLINE AGORA';
            if (diffHours < 24) return 'ACESSADO HOJE';
            if (diffDays === 1) return 'ACESSADO ONTEM';
            return `${diffDays} DIAS ATRÁS`;
        }

        function accessLesson(lessonId) {
            localStorage.setItem(STORAGE_KEY_PREFIX + lessonId, Date.now());
            renderLessons();
            window.location.href = `redes/aula${lessonId}.html`;
        }

        function renderLessons() {
            mapContainer.innerHTML = ''; 

            lessonsData.forEach((lesson) => {
                const lastAccess = localStorage.getItem(STORAGE_KEY_PREFIX + lesson.id);
                const timeString = getTimeAgo(lastAccess);
                const hasAccess = lastAccess !== null;

                // Formata o número da aula com zero à esquerda (ex: Aula 01)
                const formattedId = String(lesson.id).padStart(2, '0');

                const lessonItem = document.createElement('div');
                lessonItem.className = `lesson-item ${hasAccess ? 'accessed' : ''}`;

                lessonItem.innerHTML = `
                    <a href="#" class="lesson-btn" onclick="accessLesson(${lesson.id}); return false;">
                        <i class="fas ${lesson.icon} lesson-icon"></i>
                        <div class="status-badge">
                            <i class="fas ${hasAccess ? 'fa-check' : 'fa-lock'}"></i>
                        </div>
                    </a>
                    <div class="lesson-title-label">Aula ${formattedId}<br>${lesson.title}</div>
                    <div class="access-info">${timeString}</div>
                `;

                mapContainer.appendChild(lessonItem);
            });
        }

        renderLessons();
    </script>
</body>
</html>
