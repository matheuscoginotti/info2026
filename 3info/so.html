<!DOCTYPE html>

<head>

        :root {
            --bg-color: #0f172a; 
            --accent-blue: #3b82f6; /* Azul um pouco mais vibrante para SO */

<body>

        <div class="subtitle">Trilha de Aprendizagem</div>

    <div class="lesson-map" id="lessonMap"></div>

    <script>
        const STORAGE_KEY_PREFIX = '3info_so_lesson_';
        const mapContainer = document.getElementById('lessonMap');

        const lessonsData = [
            { id: 1, title: "Introdução e Diferenças entre SOs", icon: "fa-microchip" },
            { id: 2, title: "Sistemas de Arquivos", icon: "fa-folder-tree" },
            { id: 3, title: "Unidades de Medida e Binário", icon: "fa-database" }
        ];

        // ... (use o mesmo script renderLessons e accessLesson do redes.html, ajustando a URL para 'so/aulaX.html')
        function accessLesson(lessonId) {
            localStorage.setItem(STORAGE_KEY_PREFIX + lessonId, Date.now());
            window.location.href = `so/aula${lessonId}.html`;
        }
        // ... (renderLessons e lógica de foguetes igual à trilha de redes)
    </script>
