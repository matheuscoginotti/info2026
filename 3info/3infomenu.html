<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3º Ano - Informática para Internet</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Paleta Padrão (Estilo Enfermagem) */
            --bg-color: #0f172a; 
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-gold: #d4af37;
            --accent-blue: #38bdf8;
            --border-tech: rgba(148, 163, 184, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Fundo de Grade Estático (Padrão Enfermagem) --- */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--border-tech) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-tech) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        /* --- Cabeçalho Fixo --- */
        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--accent-blue);
            padding: 1.5rem 20px;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .btn-back {
            color: var(--accent-blue);
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .btn-back:hover {
            color: var(--text-primary);
        }

        header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .header-spacer { width: 80px; }

        /* --- Container Principal --- */
        .menu-container {
            width: 100%;
            max-width: 1200px;
            padding: 4rem 20px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .menu-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .menu-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            margin-bottom: 0.5rem;
        }

        .menu-subtitle {
            font-family: 'Rajdhani', sans-serif;
            color: var(--accent-gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- Grid de Cards --- */
        .cards-wrapper {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        /* --- Estilo do Card (Adaptado para Cores da Enfermagem) --- */
        .tech-card {
            background: var(--card-bg);
            border: 1px solid var(--border-tech);
            border-radius: 12px;
            width: 320px;
            padding: 3rem 1.5rem 2.5rem 1.5rem;
            text-align: center;
            position: relative;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tech-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15);
            background: rgba(30, 41, 59, 0.95);
        }

        /* Ícone */
        .icon-box {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: var(--accent-gold);
            height: 80px;
            width: 80px;
            border-radius: 50%;
            border: 1px dashed var(--border-tech);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .tech-card:hover .icon-box {
            color: var(--accent-blue);
            border-color: var(--accent-blue);
            transform: scale(1.1) rotate(5deg);
        }

        /* Título da Disciplina */
        .tech-card h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 2.5rem;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.3;
            min-height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Botão Acessar */
        .btn-tech {
            margin-top: auto;
            padding: 0.8rem 2.5rem;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--text-secondary);
            border-radius: 6px;
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 85%;
        }

        .btn-tech::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--accent-gold);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .tech-card:hover .btn-tech {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .btn-tech:hover {
            color: #0f172a !important; /* Texto escuro no hover para destacar */
            border-color: var(--accent-gold);
        }

        .btn-tech:hover::before {
            left: 0;
        }

        /* --- Decoração de Canto --- */
        .corner-deco {
            position: absolute;
            top: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 45px 45px 0;
            border-color: transparent var(--border-tech) transparent transparent;
            border-radius: 0 12px 0 0;
            opacity: 0.6;
            transition: border-color 0.3s;
        }

        .tech-card:hover .corner-deco {
            border-color: transparent var(--accent-blue) transparent transparent;
        }

        /* Responsividade */
        @media (max-width: 900px) {
            .menu-title { font-size: 2.5rem; }
            .cards-wrapper { flex-direction: column; align-items: center; }
            .tech-card { width: 100%; max-width: 350px; }
            header h1 { font-size: 1.2rem; }
            .header-spacer { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar</a>
        <h1>3º Ano - Informática</h1>
        <div class="header-spacer"></div>
    </header>

    <main class="menu-container">
        
        <div class="menu-header">
            <h2 class="menu-title">Grade Curricular</h2>
            <div class="menu-subtitle">Selecione a disciplina desejada</div>
        </div>

        <div class="cards-wrapper">
            
            <!-- Disciplina 1: Redes e IoT -->
            <div class="tech-card">
                <div class="corner-deco"></div>
                <div class="icon-box">
                    <i class="fa-solid fa-ethernet"></i>
                </div>
                <h3>Redes, Seg. da Informação e IoT</h3>
                <a href="aula1_redes.html" class="btn-tech">Acessar</a>
            </div>

            <!-- Disciplina 2: Desenvolvimento Web -->
            <div class="tech-card">
                <div class="corner-deco"></div>
                <div class="icon-box">
                    <i class="fa-solid fa-code"></i>
                </div>
                <h3>Desenvolvimento Web (PHP / MySQL)</h3>
                <a href="#" class="btn-tech">Acessar</a>
            </div>

            <!-- Disciplina 3: Suporte e Manutenção -->
            <div class="tech-card">
                <div class="corner-deco"></div>
                <div class="icon-box">
                    <i class="fa-solid fa-server"></i>
                </div>
                <h3>Infraestrutura e GLPI</h3>
                <a href="#" class="btn-tech">Acessar</a>
            </div>

        </div>

    </main>

</body>
</html>
